meta:
  name:
    full: SAMIZDATA
    short: SAMIZDATA
  link:
    home: https://samizdata.co
  description: |
    Central source of truth for the SAMIZDATA brand across Quarto and
    other brand.yml-aware outputs.
  foundations:
    references:
      - css/app.css
      - _quarto.yml

logo:
  images:
    wordmark:
      path: images/logo.svg
      alt: SAMIZDATA wordmark
    mark:
      path: images/icon-1024x1024.png
      alt: SAMIZDATA icon
  small:
    light: mark
    dark: mark
  medium:
    light: wordmark
    dark: wordmark
  large:
    light: wordmark
    dark: wordmark

color:
  palette:
    samizdata-background: "#FAF9F6"
    samizdata-accent: "#9F1853"
    white: "#FFFFFF"
    cool-gray-10: "#F2F4F8"
    cool-gray-30: "#DDE1E6"
    cool-gray-70: "#525252"
    cool-gray-100: "#161616"
    blue-60: "#0F62FE"
    green-50: "#24A148"
    orange-50: "#FF832B"
    red-50: "#FA4D56"
    text-muted-light: "#525252"
    text-muted-dark: "#DDE1E6"
    border-light: "#DDE1E6"
    border-dark: "#525252"
    surface-light: "#FFFFFF"
    surface-dark: "#525252"
    code-inline-bg-light: "#F2F4F8"
    code-inline-bg-dark: "#525252"
    code-block-bg-light: "#F2F4F8"
    code-block-bg-dark: "#525252"

  foreground:
    light: cool-gray-100
    dark: cool-gray-10
  background:
    light: samizdata-background
    dark: cool-gray-100

  primary: samizdata-accent
  secondary:
    light: cool-gray-10
    dark: cool-gray-70
  tertiary:
    light: white
    dark: cool-gray-70

  success: green-50
  info: blue-60
  warning: orange-50
  danger: red-50
  light: cool-gray-10
  dark: cool-gray-100

typography:
  fonts:
    - family: Roboto
      source: google
    - family: Roboto Slab
      source: google
    - family: Roboto Mono
      source: google

  base:
    family: Roboto
    weight: 400
    line-height: 1.6

  headings:
    family: Roboto Slab
    weight: 600
    line-height: 1.2
    color:
      light: cool-gray-100
      dark: cool-gray-10

  link:
    weight: 500
    color: primary
    decoration: none

  monospace:
    family: Roboto Mono
    weight: 400

  monospace-inline:
    background-color:
      light: code-inline-bg-light
      dark: code-inline-bg-dark
    color:
      light: cool-gray-100
      dark: cool-gray-10

  monospace-block:
    line-height: 1.5
    background-color:
      light: code-block-bg-light
      dark: code-block-bg-dark
    color:
      light: cool-gray-100
      dark: cool-gray-10

defaults:
  bootstrap:
    defaults:
      body-bg: $brand-samizdata-background
      body-color: $brand-cool-gray-100
      primary: $brand-samizdata-accent
      secondary: $brand-cool-gray-10
      success: $brand-green-50
      info: $brand-blue-60
      warning: $brand-orange-50
      danger: $brand-red-50
      light: $brand-cool-gray-10
      dark: $brand-cool-gray-100
      link-color: $brand-samizdata-accent
      code-color: $brand-samizdata-accent
      code-bg: $brand-cool-gray-10
      pre-color: $brand-cool-gray-100
      pre-bg: $brand-cool-gray-10
      border-color: $brand-cool-gray-30
      focus-ring-color: rgba(159, 24, 83, 0.25)
      card-bg: $brand-white
      card-color: $brand-cool-gray-100
      card-border-color: $brand-cool-gray-30
      input-bg: $brand-white
      input-color: $brand-cool-gray-100
      input-border-color: $brand-cool-gray-30
      navbar-bg: $brand-samizdata-background
      navbar-fg: $brand-cool-gray-100
      navbar-hl: $brand-samizdata-accent
      font-family-sans-serif: '"Roboto", sans-serif'
      font-family-monospace: '"Roboto Mono", monospace'
      headings-font-family: '"Roboto Slab", serif'
      headings-font-weight: 600
      headings-line-height: 1.2
      border-radius: 0.5rem
      border-radius-sm: 0.375rem
      border-radius-lg: 0.625rem
      enable-rounded: true
      enable-smooth-scroll: true
      link-decoration: none
      link-hover-decoration: none
      component-active-bg: $brand-samizdata-accent
      component-active-color: $brand-white

    rules: |
      html {
        scroll-behavior: smooth;
      }

      body {
        text-rendering: optimizeLegibility;
      }

      :focus-visible {
        outline: 2px solid $brand-samizdata-accent;
        outline-offset: 2px;
      }

      pre,
      code,
      kbd,
      samp {
        font-variant-ligatures: none;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
